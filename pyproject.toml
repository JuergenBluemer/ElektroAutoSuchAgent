[project]
name = "ev-search-agent"
version = "0.1.1"
description = "Workflow worker that researches electric-vehicle news and emails a report"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.19.0",
    "aiosmtplib>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/worker/tests"]
